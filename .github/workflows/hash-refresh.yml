name: Refresh Protocol Artifacts

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to target"
        required: true
        default: "main"
      pr_branch:
        description: "Branch used for generated updates"
        required: true
        default: "ci/protocol-artifacts-refresh"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    uses: monarchic-ai/.github/.github/workflows/maintenance.yml@main
    with:
      checkout_ref: ${{ inputs.base_branch }}
      maintenance_command: |
        nix run .#generate-proto
        nix run .#generate-json-schema
        nix run .#update-local-hashes
      commit_paths: |
        schemas/v1/schema.json
        src/**
        hashes/local-hashes.json
      commit_message: "chore(protocol): refresh generated artifacts and local hashes"
      push_branch: ${{ inputs.pr_branch }}
      create_pull_request: true
      pull_request_base_branch: ${{ inputs.base_branch }}
      pull_request_title: "chore(protocol): refresh generated artifacts and local hashes"
      pull_request_body: |
        Automated refresh:
        - `scripts/generate-proto.sh`
        - `scripts/generate-json-schema.sh`
        - `scripts/update-local-hashes.sh`

        Merge after CI passes, then tag and push release tag.
      pull_request_labels: |
        automation
        release
    secrets:
      MONARCHIC_GITHUB_PAT: ${{ secrets.MONARCHIC_GITHUB_PAT }}
