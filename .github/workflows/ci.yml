name: ci

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch or SHA) to check"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate and generate artifacts
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ (inputs.ref && startsWith(inputs.ref, 'refs/pull/')) && github.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27

      - name: Install schema validation dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate JSON schemas
        run: bash scripts/lint-schemas.sh

      - name: Validate JSON schemas against fixtures
        run: bash scripts/test-json-schema.sh

      - name: Validate README schema index coverage
        run: bash scripts/test-readme-schema-index-coverage.sh

      - name: Validate schema changelog format
        run: bash scripts/test-schema-changelog-format.sh

      - name: Validate protobuf codegen
        run: nix run .#test-proto -- schemas/v1/monarchic_agent_protocol.proto

      - name: Validate Lean protobuf schema manifest
        run: bash scripts/check-lean-protobuf-schema-manifest.sh

      - name: Compile examples
        run: nix build .#example-rust .#example-ts .#example-python .#example-java .#example-kotlin .#example-cpp .#example-ruby .#example-csharp

      - name: Validate generated root JSON schema
        run: |
          set -euo pipefail
          bash scripts/generate-json-schema.sh
          git diff --exit-code -- schemas/v1/schema.json

      - name: Validate local hash manifest
        run: |
          set -euo pipefail
          bash scripts/update-local-hashes.sh
          git diff --exit-code -- hashes/local-hashes.json


      - name: Cargo test
        run: nix develop -c cargo test

      - name: Generate protobuf outputs
        run: nix run .#generate-proto

      - name: Generate JSON Schemas
        run: nix run .#generate-json-schema

      - name: Update local hashes
        run: nix run .#update-local-hashes

      - name: Fail on PR when generated changes exist
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes on pull request."
            exit 0
          fi
          echo "Generated changes detected on pull request; run the generators locally and commit the results." >&2
          git --no-pager diff --stat
          git status --porcelain
          exit 1

      - name: Create PR for generated changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PR_BOT_TOKEN }}
          commit-message: "ci: update generated artifacts [ci skip]"
          title: "ci: update generated artifacts"
          body: "Automated updates from generate-proto, generate-json-schema, and update-local-hashes."
          branch: "ci/update-generated-artifacts-${{ github.run_id }}"
          base: main
          add-paths: |
            flake.nix
            schemas/v1
            src
